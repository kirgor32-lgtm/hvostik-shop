<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <mask id="hole"><rect width="64" height="64" fill="#fff"/><circle cx="32" cy="27" r="5.6" fill="#000"/></mask>
    <clipPath id="front"><rect x="32" y="12" width="20" height="16"/></clipPath>
  </defs>
  <!-- кольцо целиком позади бирки -->
  <circle class="ring" cx="32" cy="15" r="11.5" fill="none" stroke="#fff" stroke-width="4"/>
  <!-- бирка с отверстием: между краем и отверстием — перемычка, кольцо уходит за неё слева -->
  <circle cx="32" cy="41" r="22.5" fill="#ff6a00" mask="url(#hole)"/>
