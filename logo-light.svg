    <circle cx="32" cy="15" r="11.5" fill="none" stroke="#ff6a00" stroke-width="0"/>
    <circle class="ring" cx="32" cy="15" r="11.5" fill="none" stroke="#fff" stroke-width="4"/>
  </g>
